<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingredients Centre Tz — Bidhaa Zetu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafb; color: #1a2b3c; line-height: 1.6; }
  header { background: linear-gradient(135deg, #0d5c63 0%, #14919b 100%); color: white; padding: 20px 16px; text-align: center; }
  header h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
  header p { font-size: 14px; opacity: 0.9; }
  .search-wrap { max-width: 600px; margin: 20px auto; padding: 0 16px; }
  .search-wrap input { width: 100%; padding: 12px 16px; border: 1px solid #d1d9e0; border-radius: 10px; font-size: 15px; outline: none; background: white; }
  .search-wrap input:focus { border-color: #14919b; }
  .cats { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 16px; max-width: 1200px; margin: 0 auto; }
  .cat { padding: 8px 16px; background: white; border: 1px solid #d1d9e0; border-radius: 20px; font-size: 13px; white-space: nowrap; cursor: pointer; }
  .cat.active { background: #14919b; color: white; border-color: #14919b; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; max-width: 1200px; margin: 0 auto; padding: 0 16px 100px; }
  .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .card img { width: 100%; height: 130px; object-fit: cover; background: #eef2f5; }
  .card .info { padding: 10px 12px; }
  .card h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
  .card .cat-label { font-size: 11px; color: #14919b; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .card .price { font-size: 16px; font-weight: 700; color: #0d5c63; }
  .card .unit { font-size: 11px; color: #6b7a88; font-weight: 400; }
  .card .wa-btn { display: block; margin-top: 10px; padding: 8px; background: #25D366; color: white; text-align: center; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 600; }
  .float-wa { position: fixed; bottom: 20px; right: 20px; background: #25D366; color: white; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(37,211,102,0.4); text-decoration: none; font-size: 28px; z-index: 100; }
  footer { text-align: center; padding: 24px 16px; font-size: 12px; color: #6b7a88; background: white; border-top: 1px solid #eef2f5; }
</style>
</head>
<body>
<header>
  <h1>Ingredients Centre Tz</h1>
  <p>Bidhaa bora kwa bei nafuu — Dodoma, Tanzania</p>
</header>
<div class="search-wrap">
  <input type="text" id="searchBox" placeholder="🔍 Tafuta bidhaa..." oninput="filterProducts()">
</div>
<div class="cats" id="catBar"></div>
<div class="grid" id="productGrid"></div>
<a href="https://wa.me/255783266378" class="float-wa" target="_blank">💬</a>
<footer>© 2026 Ingredients Centre Tz · Mawasiliano: +255 XXX XXX XXX</footer>
<script>
const products = [
  { name: "Citric Acid", price: 15000, unit: "kwa kilo", cat: "Food Additives", img: "https://images.unsplash.com/photo-1607619056574-7b8d3ee536b2?w=400" },
  { name: "Sodium Bicarbonate", price: 8000, unit: "kwa kilo", cat: "Food Additives", img: "https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=400" },
  { name: "Glycerin", price: 22000, unit: "kwa lita", cat: "Cosmetics", img: "https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?w=400" },
  { name: "Essential Oil - Lavender", price: 35000, unit: "kwa 100ml", cat: "Cosmetics", img: "https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?w=400" },
  { name: "Caustic Soda", price: 12000, unit: "kwa kilo", cat: "Industrial", img: "https://images.unsplash.com/photo-1581093588401-fbb62a02f120?w=400" },
  { name: "Hydrogen Peroxide", price: 18000, unit: "kwa lita", cat: "Industrial", img: "https://images.unsplash.com/photo-1581093588401-fbb62a02f120?w=400" },
  { name: "Food Coloring - Red", price: 6000, unit: "kwa 100ml", cat: "Food Additives", img: "https://images.unsplash.com/photo-1607619056574-7b8d3ee536b2?w=400" },
  { name: "Coconut Oil", price: 25000, unit: "kwa lita", cat: "Cosmetics", img: "https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?w=400" }
];
const whatsappNumber = "255XXXXXXXXX";
function renderCategories() {
  const cats = ["Zote", ...new Set(products.map(p => p.cat))];
  document.getElementById("catBar").innerHTML = cats.map((c, i) =>
    `<button class="cat ${i===0?'active':''}" onclick="selectCat(this, '${c}')">${c}</button>`
  ).join("");
}
let activeCat = "Zote";
function selectCat(btn, cat) {
  document.querySelectorAll(".cat").forEach(b => b.classList.remove("active"));
  btn.classList.add("active"); activeCat = cat; filterProducts();
}
function filterProducts() {
  const q = document.getElementById("searchBox").value.toLowerCase();
  const filtered = products.filter(p => {
    const matchCat = activeCat === "Zote" || p.cat === activeCat;
    const matchSearch = p.name.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
  renderProducts(filtered);
}
function renderProducts(list) {
  if (list.length === 0) {
    document.getElementById("productGrid").innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:40px;color:#6b7a88;">Hakuna bidhaa iliyopatikana.</p>';
    return;
  }
  document.getElementById("productGrid").innerHTML = list.map(p => `
    <div class="card">
      <img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300/eef2f5/6b7a88?text=Bidhaa'">
      <div class="info">
        <div class="cat-label">${p.cat}</div>
        <h3>${p.name}</h3>
        <div class="price">TZS ${p.price.toLocaleString()} <span class="unit">${p.unit}</span></div>
        <a class="wa-btn" href="https://wa.me/${whatsappNumber}?text=Habari,%20nahitaji%20${encodeURIComponent(p.name)}" target="_blank">Agiza kwa WhatsApp</a>
      </div>
    </div>
  `).join("");
}
renderCategories(); renderProducts(products);
</script>
</body>
</html>
